[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-memory-reproduction"
version = "0.1.0"
description = "A local, auditable reproduction of Codex's two-phase file memory workflow"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-memory = "codex_memory.cli:main"

[tool.setuptools.packages.find]
include = ["codex_memory*"]

